version: '3.8'
services:
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    environment:
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_CERT_FILE=/etc/grafana/ssl/grafana.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/ssl/grafana.key
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_DOMAIN=jubilee.homingbeacon.net
      - GF_SERVER_ROOT_URL=https://jubilee.homingbeacon.net:13000
      - GF_SERVER_ENFORCE_DOMAIN=False
      - GF_PLUGIN_MARCUSOLSSON_CSV_DATASOURCE_ALLOW_LOCAL_MODE=True
      - GF_USERS_DEFAULT_THEME=light
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak-OAuth
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=e043efdf-ab97-4ca1-85ea-99ae4e24edfb
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=7451ff0c-2c3e-4e0e-a616-e1317281819d
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid
      - GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH=email
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=username
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=full_name
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://idm.twinairdmp.online/oauth2/authorize
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://idm.twinairdmp.online/oauth2/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://idm.twinairdmp.online/user
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'
    restart: unless-stopped
    ports:
      - '13000:3000'
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./conf/grafana.db:/var/lib/grafana/grafana.db
      - ./conf/plugins:/var/lib/grafana/plugins
      - ./conf/ssl:/etc/grafana/ssl
      - ./conf/img:/usr/share/grafana/public/img
volumes:
    grafana-storage: {}
